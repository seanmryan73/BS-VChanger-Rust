[package]
name = "bs-vchanger"
version = "2026.6.20"
edition = "2021"

[dependencies]
eframe    = "0.29"
egui      = "0.29"
cpal      = "0.15"
ringbuf   = "0.4"
rubato    = "0.15"
nnnoiseless = "0.5"
rustfft   = "6"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rfd       = "0.14"
uuid      = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 1
