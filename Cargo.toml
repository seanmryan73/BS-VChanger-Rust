[package]
name = "bs-vchanger"
version = "2026.7.27"
edition = "2021"
license = "MIT"

[dependencies]
eframe    = "0.29"
egui      = "0.29"
cpal      = "0.15"
ringbuf   = "0.4"
rubato    = "0.15"
# `default-features = false` drops the `bin` feature, which pulls clap 3.2.25 and
# atty 0.2.14 — an EOL CLI stack with a known advisory — into a GUI app that
# never parses an argument. Only the library half is used.
nnnoiseless = { version = "0.5", default-features = false }
rustfft   = "6"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
uuid      = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
ico = "0.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 1
