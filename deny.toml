# cargo-deny config for a Windows-only BS-* app. `cargo deny check` in CI.
[graph]
# Only resolve what actually builds for this target. This drops winit's Linux/Wayland chain
# (quick-xml & co.), whose advisories otherwise need hand-kept ignores in .cargo/audit.toml.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# RustSec database; any vulnerability or unsound advisory fails. Ignores need a comment and a re-check date.
# Unmaintained: fail only for crates this app depends on directly - a transitive one (egui's paste,
# ttf-parser) is egui's to replace, and failing on it blocks every push for something you can't fix.
unmaintained = "workspace"
ignore = [
    # ringbuf 0.4 double free in Consumer::skip/clear, reachable only when an element's Drop panics.
    # Not reachable here: every ring buffer holds f32, and no element type has a Drop impl. The fix is ringbuf
    # 0.5, a breaking API change on the real-time audio thread: take it as its own change.
    # Re-check if a ring buffer ever carries a type with a Drop impl. (2026-10-09)
    { id = "RUSTSEC-2026-0293", reason = "unreachable: no element type has Drop; fix needs ringbuf 0.5" },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "CC0-1.0", "MPL-2.0", "Unlicense",
]
confidence-threshold = 0.8
# Data licences, allowed for the one crate that ships the data, never globally:
# egui's bundled fonts (OFL + Ubuntu Font Licence; egui 0.29 spells it LicenseRef-UFL-1.0, 0.34+ uses
# the SPDX id) and webpki-roots' copy of Mozilla's CA list (CDLA-Permissive-2.0).
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "LicenseRef-UFL-1.0", "Ubuntu-font-1.0"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]
# The app itself has no licence field; `publish = false` in [package] marks it private.
private = { ignore = true }
# An allow-list entry no crate uses is not a problem.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"   # egui pulls a few duplicates; report, don't fail
wildcards = "deny"           # no `*` version requirements
deny = [
    { crate = "openssl-sys", reason = "C toolchain + second TLS stack; use rustls or SChannel (Cross-Project-Anti-Patterns.md)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
